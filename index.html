<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Times New Roman</title>
  <style>
    :root {
      --ui-font: "Neue Haas Grotesk Display Pro", "Neue Haas Grotesk Text Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    #stage {
      position: fixed;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      mix-blend-mode: difference;
      isolation: auto;
    }

    #specimenTitle {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1;
      margin: 0;
      color: #fff;
      font-family: "Times New Roman", Times, serif;
      font-size: 25px;
      line-height: 25px;
      font-weight: 400;
      letter-spacing: -0.025em;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
      mix-blend-mode: difference;
    }

    #cam {
      position: fixed;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .dot {
      position: fixed;
      left: 0;
      top: 0;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      background: rgba(255,255,255,0.55);
    }


    /* Right column */
    #uiWrap {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 20;
      width: min(250px, calc(34vw - 10px));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #ui {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      padding: 14px;
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 20px;
      overflow: hidden;
      background: rgba(0,0,0,0.22);
      box-shadow: 0 8px 22px rgba(0,0,0,0.14);
      -webkit-backdrop-filter: blur(10px) saturate(135%);
      backdrop-filter: blur(10px) saturate(135%);
      color: #fff;
      font-family: var(--ui-font);
      font-size: 10px;
      line-height: 10px;
      font-weight: 700;
      letter-spacing: 0;
      user-select: none;
    }

    .input-wrap {
      position: relative;
      width: 100%;
      min-height: 16px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.34);
      box-sizing: border-box;
    }

    #ui input[type="text"] {
      width: 100%;
      min-height: 16px;
      padding: 0 0 3px 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font: inherit;
      font-weight: 700;
      line-height: 10px;
      caret-color: #fff;
    }

    #inputCaret {
      position: absolute;
      left: 0;
      bottom: 3px;
      width: 1px;
      height: 10px;
      background: #fff;
      pointer-events: none;
      animation: inputCaretBlink 0.9s steps(1, end) infinite;
    }

    .input-wrap.has-text #inputCaret,
    .input-wrap:focus-within #inputCaret { display: none; }

    @keyframes inputCaretBlink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    #ui input[type="text"]::placeholder {
      color: rgba(255,255,255,0.62);
      opacity: 1;
    }

    #ui input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      min-width: 0;
      height: 14px;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background: transparent;
      cursor: pointer;
    }

    #ui input[type="range"]:disabled {
      opacity: 0.28;
      cursor: default;
    }

    #ui input[type="range"]::-webkit-slider-runnable-track {
      height: 1px;
      background: rgba(255,255,255,0.72);
    }

    #ui input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      margin-top: -4.5px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 8px rgba(0,0,0,0.28);
    }

    #ui input[type="range"]::-moz-range-track {
      height: 1px;
      background: rgba(255,255,255,0.72);
    }

    #ui input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border: 0;
      border-radius: 50%;
      background: #fff;
    }


    #backgroundRange::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(90deg,
        #000 0%, #000 2%,
        #f00 4%, #ff0 20%, #0f0 36%,
        #0ff 52%, #00f 68%, #f0f 84%, #f00 100%);
    }
    #backgroundRange::-moz-range-track {
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(90deg,
        #000 0%, #000 2%,
        #f00 4%, #ff0 20%, #0f0 36%,
        #0ff 52%, #00f 68%, #f0f 84%, #f00 100%);
    }
    #backgroundRange::-webkit-slider-thumb {
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.45);
    }
    #backgroundRange::-moz-range-thumb {
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.45);
    }
    .background-row,
    .range-row {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .control { display: flex; flex-direction: column; gap: 8px; }
    .control-label { opacity: 1; }

    .background-row input[type="range"],
    .range-row input[type="range"] {
      display: block;
      width: 100%;
      min-width: 0;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    .word-panel {
      border: 1px solid rgba(255,255,255,0.16);
      background: #000;
    }

    .word-panel summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 14px;
      cursor: pointer;
    }
    .word-panel summary::-webkit-details-marker { display: none; }
    .word-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .word-chevron {
      flex: 0 0 auto;
      width: 14px;
      height: 14px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg);
      transition: transform 0.18s;
      margin-right: 2px;
      margin-top: -6px;
    }
    .word-panel[open] .word-chevron {
      transform: rotate(225deg);
      margin-top: 2px;
    }
    .word-body {
      padding: 0 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .word-body .control { gap: 8px; }
    .word-body .range-row { gap: 5px; }
    .word-dial {
      position: relative;
      width: 88px;
      height: 88px;
      margin: 2px auto 0;
      border-radius: 50%;
      touch-action: none;
      cursor: grab;
    }
    .word-dial:active { cursor: grabbing; }
    .word-dial .tick {
      left: 43px;
      top: 5px;
      height: 10px;
      transform-origin: 1px 39px;
      background: rgba(255,255,255,0.24);
    }
    .word-dial .tick.active { height: 14px; background: rgba(255,255,255,1); }

    #shakeIntro {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      color: #fff;
      font-family: var(--ui-font);
      font-size: 40px;
      line-height: 40px;
      font-weight: 700;
      letter-spacing: 0;
      pointer-events: none;
      user-select: none;
    }
    #shakeIntro.show {
      display: grid;
      animation: shakeIntroFade 3.8s ease-in-out forwards;
    }

    @keyframes shakeIntroFade {
      0% { opacity: 0; }
      24% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }


    #cameraButton, #cleanButton {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 20px;
      overflow: hidden;
      background: rgba(0,0,0,0.22);
      color: #fff;
      font-family: var(--ui-font);
      font-size: 10px;
      line-height: 10px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0,0,0,0.14);
      -webkit-backdrop-filter: blur(10px) saturate(135%);
      backdrop-filter: blur(10px) saturate(135%);
    }
    #cameraButton:hover, #cleanButton:hover { background: rgba(255,255,255,0.08); }
    #cameraButton:disabled { opacity: 0.45; cursor: default; }
    #cleanButton { margin-top: 0; }

    @media (max-width: 900px) {
      #uiWrap {
        position: static;
        width: min(250px, calc(100vw - 20px));
        margin: 200px 10px 10px auto;
      }
    }
  </style>
</head>
<body>
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="stage"></canvas>
  <div id="specimenTitle">Times New Roman Interactive Specimen</div>

  <div id="uiWrap">
    <div id="ui">
      <div class="control">
        <div class="control-label">Type something:</div>
        <div class="input-wrap" id="inputWrap">
          <input id="charInput" type="text" maxlength="20" placeholder="" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type something" autofocus>
          <span id="inputCaret" aria-hidden="true"></span>
        </div>
      </div>
      <div class="control">
        <div class="control-label">Size:</div>
        <div class="range-row"><input id="sizeRange" type="range" step="0.01" value="0" aria-label="Global size"></div>
      </div>
      <div class="control">
        <div class="control-label">Counter:</div>
        <div class="range-row"><input id="countRange" type="range" min="10" max="500" step="1" value="120" aria-label="Letter count"></div>
      </div>
      <div class="control">
        <div class="control-label">Background:</div>
        <div class="background-row"><input id="backgroundRange" type="range" min="0" max="361" step="1" value="0" aria-label="Background color"></div>
      </div>
    </div>
    <button id="cameraButton" type="button">Turn on the camera and interact</button>
    <button id="cleanButton" type="button">Clean</button>
  </div>

  <div id="shakeIntro">Shake your hands</div>

  <script type="module">
    // ---------- Settings ----------
    const SWAP_HANDS = false;
    const INITIAL_LETTERS = 120;
    const MIN_LETTERS = 10;
    const MAX_LETTERS = 500;
    const MAX_INPUT_CHARS = 20;
    const BASE_MIN = 0.35;
    const BASE_MAX = 0.78;
    const MAX_SPEED = 16;
    const REST = 0.9;
    const PUSH_R = 22;
    const PUSH_SMOOTH = 0.5;
    const MARGIN = 0.1;
    const BORN_MS = 450;

    // Background characters include letters, numbers and common punctuation glyphs.
    const CHARS = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,;:!?()&@%+-–—'";
    const PUSH_IDX = [0, 4, 5, 8, 9, 12, 13, 16, 17, 20];
    const MIN_SIZE = 0.4;
    const MAX_SIZE = 10;
    const TAU = Math.PI * 2;

    const video = document.getElementById('cam');
    const stage = document.getElementById('stage');
    const g = stage.getContext('2d');
    const charInput = document.getElementById('charInput');
    const inputWrap = document.getElementById('inputWrap');
    const sizeRange = document.getElementById('sizeRange');
    const countRange = document.getElementById('countRange');
    const backgroundRange = document.getElementById('backgroundRange');
    const cameraButton = document.getElementById('cameraButton');
    const cleanButton = document.getElementById('cleanButton');
    const shakeIntro = document.getElementById('shakeIntro');

    let DPR = 1;
    function fitStage() {
      DPR = window.devicePixelRatio || 1;
      stage.width = Math.round(window.innerWidth * DPR);
      stage.height = Math.round(window.innerHeight * DPR);
    }
    fitStage();
    window.addEventListener('resize', fitStage);

    const FONT_PX = 2.5 * (parseFloat(getComputedStyle(document.documentElement).fontSize) || 16);
    const mctxFont = document.createElement('canvas').getContext('2d');
    mctxFont.font = `${FONT_PX}px "Times New Roman", Times, serif`;
    const widthCache = {};
    function charWidth(ch) {
      if (!(ch in widthCache)) widthCache[ch] = mctxFont.measureText(ch).width;
      return widthCache[ch];
    }
    const WORD_KERN_EM = -0.025; // Adobe-style kerning -25 = -25/1000 em
    function textWidth(text) {
      mctxFont.font = `${FONT_PX}px "Times New Roman", Times, serif`;
      let width = 0;
      const chars = Array.from(text);
      for (let i = 0; i < chars.length; i++) {
        width += mctxFont.measureText(chars[i]).width;
        if (i < chars.length - 1) width += FONT_PX * WORD_KERN_EM;
      }
      return width;
    }

    // ---------- Scene objects ----------
    // letters = generated background only. words = user-created objects and are never affected by Counter.
    let letters = [];
    let words = [];
    let globalSize = 1;
    let wordSeq = 0;
    let audioCtx = null;
    let lastUiBeep = 0;

    function ensureAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function uiBeep(intensity = 0.5) {
      const ctx = ensureAudio();
      if (!ctx) return;
      const now = ctx.currentTime;
      if (now - lastUiBeep < 0.03) return;
      lastUiBeep = now;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 620 + Math.max(0, Math.min(1, intensity)) * 220;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.012, now + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.045);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.05);
    }

    function allBodies() {
      return letters.concat(words);
    }

    function bodyRadius(body) {
      return body.r0 * body.sz * body.scale;
    }

    function makeWordHitPoints(text) {
      const total = textWidth(text);
      let cursor = -total * 0.5;
      const points = [];
      for (const ch of text) {
        const w = charWidth(ch);
        if (ch !== ' ') {
          const x = cursor + w * 0.5;
          // Three overlapping circles approximate each glyph's visible height.
          // This keeps the collision close to the text while avoiding overlaps.
          const r = Math.max(FONT_PX * 0.22, Math.min(FONT_PX * 0.30, w * 0.46));
          const yOffset = FONT_PX * 0.22;
          points.push({ x, y: -yOffset, r });
          points.push({ x, y: 0,        r });
          points.push({ x, y:  yOffset, r });
        }
        cursor += w;
      }
      return points;
    }

    function collisionCircles(body) {
      if (body.kind !== 'word' || !body.hitPoints || !body.hitPoints.length) {
        return [{ x: body.x, y: body.y, r: body.rr }];
      }
      const sc = body.sz * body.scale;
      return body.hitPoints.map(h => ({
        x: body.x + h.x * sc,
        y: body.y + (h.y || 0) * sc,
        r: h.r * sc
      }));
    }

    function deepestCircleContact(a, b) {
      const ac = collisionCircles(a), bc = collisionCircles(b);
      let best = null;
      for (const ca of ac) {
        for (const cb of bc) {
          const dx = cb.x - ca.x, dy = cb.y - ca.y;
          const minD = ca.r + cb.r;
          const d2 = dx * dx + dy * dy;
          if (d2 >= minD * minD) continue;
          const d = Math.sqrt(d2);
          const pen = minD - d;
          if (!best || pen > best.pen) best = { dx, dy, d, pen };
        }
      }
      return best;
    }

    function freeSpot(x, y, r0) {
      const W = window.innerWidth, H = window.innerHeight;
      for (let k = 0; k < 20; k++) {
        let px = x, py = y;
        if (k > 0) {
          const a = Math.random() * TAU;
          const d = 10 + Math.random() * 70;
          px += Math.cos(a) * d;
          py += Math.sin(a) * d;
        }
        px = Math.min(W - r0, Math.max(r0, px));
        py = Math.min(H - r0, Math.max(r0, py));
        if (allBodies().every(B => B.dying || Math.hypot(B.x - px, B.y - py) > bodyRadius(B) + r0 + 1)) {
          return { x: px, y: py };
        }
      }
      return { x: Math.min(W - r0, Math.max(r0, x)), y: Math.min(H - r0, Math.max(r0, y)) };
    }

    function randomPosition(r) {
      const W = window.innerWidth, H = window.innerHeight;
      return {
        x: r + Math.random() * Math.max(1, W - r * 2),
        y: r + Math.random() * Math.max(1, H - r * 2)
      };
    }

    function spawnLetter(instant = false) {
      const ch = CHARS[Math.floor(Math.random() * CHARS.length)];
      const w = charWidth(ch);
      const r0 = Math.max(0.3 * FONT_PX, w * 0.5);
      const p = randomPosition(r0);
      const spot = freeSpot(p.x, p.y, r0);
      const base = BASE_MIN + Math.random() * (BASE_MAX - BASE_MIN);
      const a = Math.random() * TAU;
      letters.push({
        kind: 'letter', char: ch, r0, sz: globalSize, targetSz: globalSize,
        rr: instant ? r0 : 0, scale: instant ? 1 : 0,
        alpha: 1, rot: 0, m: r0 * r0,
        x: spot.x, y: spot.y,
        vx: Math.cos(a) * base, vy: Math.sin(a) * base, base,
        born: instant ? performance.now() - BORN_MS : performance.now(),
        dying: false, dieAt: 0
      });
    }

    function createWord(text, sz = globalSize) {
      text = text.trim();
      if (!text) return null;
      const w = Math.max(FONT_PX * 0.6, textWidth(text));
      // r0 is kept only for screen bounds/mass; collisions use per-character hit points.
      const r0 = Math.max(FONT_PX * 0.45, Math.hypot(w * 0.5, FONT_PX * 0.42));
      const hitPoints = makeWordHitPoints(text);
      const p = randomPosition(Math.min(r0 * sz, Math.min(innerWidth, innerHeight) * 0.4));
      const spot = freeSpot(p.x, p.y, Math.min(r0 * sz, Math.min(innerWidth, innerHeight) * 0.4));
      const base = BASE_MIN + Math.random() * (BASE_MAX - BASE_MIN);
      const a = Math.random() * TAU;
      const word = {
        id: 'word-' + (++wordSeq),
        kind: 'word', text, r0, hitPoints, sz, targetSz: sz,
        rr: 0, scale: 0, alpha: 1, color: '#39ff14',
        rot: 0, targetRot: 0,
        m: r0 * r0 * sz * sz,
        x: spot.x, y: spot.y,
        vx: Math.cos(a) * base, vy: Math.sin(a) * base, base,
        born: performance.now(), dying: false, dieAt: 0
      };
      words.push(word);
      return word;
    }

    function seedLetters() {
      for (let i = 0; i < INITIAL_LETTERS; i++) spawnLetter(true);
    }
    seedLetters();

    // ---------- Camera and hand tracking ----------
    let handLandmarker = null;
    let cameraOk = false;
    let lastVideoTime = -1;
    const mirror = document.createElement('canvas');
    const mctx = mirror.getContext('2d');
    let handPoints = [];
    let handsMissing = 99;
    let cameraStream = null;

    async function initHand() {
      if (!handLandmarker) {
        const { FilesetResolver, HandLandmarker } = await import(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
        );
        const fileset = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );
        const modelUrl = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
        try {
          handLandmarker = await HandLandmarker.createFromOptions(fileset, {
            baseOptions: { modelAssetPath: modelUrl, delegate: "GPU" },
            runningMode: "VIDEO", numHands: 2
          });
        } catch (e) {
          handLandmarker = await HandLandmarker.createFromOptions(fileset, {
            baseOptions: { modelAssetPath: modelUrl, delegate: "CPU" },
            runningMode: "VIDEO", numHands: 2
          });
        }
      }

      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: 640, height: 480 }, audio: false
      });
      video.srcObject = cameraStream;
      await video.play();
      mirror.width = video.videoWidth || 640;
      mirror.height = video.videoHeight || 480;
      lastVideoTime = -1;
      cameraOk = true;
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      video.pause();
      video.srcObject = null;
      cameraOk = false;
      handPoints = [];
      handsMissing = 99;
      pushers.forEach(p => {
        p.init = false;
        p.vx = 0;
        p.vy = 0;
        p.el.style.opacity = 0;
      });
    }

    cameraButton.addEventListener('click', async () => {
      ensureAudio();

      if (cameraOk) {
        stopCamera();
        cameraButton.textContent = 'Turn on the camera and interact';
        return;
      }

      cameraButton.disabled = true;
      cameraButton.textContent = 'Activating camera…';
      try {
        await initHand();
        cameraButton.textContent = 'Turn off the camera';
        shakeIntro.classList.remove('show');
        void shakeIntro.offsetWidth;
        shakeIntro.classList.add('show');
        setTimeout(() => shakeIntro.classList.remove('show'), 4000);
      } catch (err) {
        console.warn('Camera unavailable', err);
        stopCamera();
        cameraButton.textContent = 'Turn on the camera and interact';
      } finally {
        cameraButton.disabled = false;
      }
    });

    function mapPoint(lm) {
      const nx = Math.min(1, Math.max(0, (lm.x - MARGIN) / (1 - 2 * MARGIN)));
      const ny = Math.min(1, Math.max(0, (lm.y - MARGIN) / (1 - 2 * MARGIN)));
      return { x: nx * window.innerWidth, y: ny * window.innerHeight };
    }

    function processHands(result) {
      const points = [];
      (result.landmarks || []).forEach((lm) => {
        PUSH_IDX.forEach(i => points.push(mapPoint(lm[i])));
      });
      if (points.length) {
        handPoints = points;
        handsMissing = 0;
      } else {
        handsMissing++;
        if (handsMissing >= 10) handPoints = [];
      }
    }

    function detect() {
      if (!cameraOk || !handLandmarker || video.readyState < 2) return;
      if (video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;
      mctx.save();
      mctx.translate(mirror.width, 0); mctx.scale(-1, 1);
      mctx.drawImage(video, 0, 0, mirror.width, mirror.height);
      mctx.restore();
      processHands(handLandmarker.detectForVideo(mirror, performance.now()));
    }

    // ---------- Hand pushers ----------
    const pushers = Array.from({ length: PUSH_IDX.length * 2 }, () => {
      const el = document.createElement('div');
      el.className = 'dot';
      document.body.appendChild(el);
      return { el, x: 0, y: 0, vx: 0, vy: 0, init: false };
    });

    function updatePushers() {
      const active = cameraOk && handsMissing < 10 && handPoints.length > 0;
      pushers.forEach((p, i) => {
        const t = active ? handPoints[i] : null;
        if (t) {
          if (!p.init) { p.x = t.x; p.y = t.y; p.vx = 0; p.vy = 0; p.init = true; }
          else {
            const nx = p.x + (t.x - p.x) * PUSH_SMOOTH;
            const ny = p.y + (t.y - p.y) * PUSH_SMOOTH;
            p.vx = Math.max(-40, Math.min(40, nx - p.x));
            p.vy = Math.max(-40, Math.min(40, ny - p.y));
            p.x = nx; p.y = ny;
          }
          p.el.style.opacity = 1;
          p.el.style.transform = `translate(${p.x - 4}px, ${p.y - 4}px)`;
        } else {
          p.init = false;
          p.vx = 0;
          p.vy = 0;
          p.el.style.opacity = 0;
        }
      });
    }

    function collidePushers() {
      const bodies = allBodies();
      for (const p of pushers) {
        if (!p.init) continue;
        for (const B of bodies) {
          let best = null;
          for (const c of collisionCircles(B)) {
            const dx = c.x - p.x, dy = c.y - p.y;
            const minD = c.r + PUSH_R;
            const d2 = dx * dx + dy * dy;
            if (d2 >= minD * minD) continue;
            const d = Math.sqrt(d2);
            const pen = minD - d;
            if (!best || pen > best.pen) best = { dx, dy, d, pen };
          }
          if (!best) continue;
          let nx, ny;
          if (best.d < 1e-6) { const a = Math.random() * TAU; nx = Math.cos(a); ny = Math.sin(a); }
          else { nx = best.dx / best.d; ny = best.dy / best.d; }
          B.x += nx * best.pen; B.y += ny * best.pen;
          const vrel = (B.vx - p.vx) * nx + (B.vy - p.vy) * ny;
          if (vrel < 0) {
            B.vx -= (1 + REST) * vrel * nx;
            B.vy -= (1 + REST) * vrel * ny;
          }
        }
      }
    }

    function collideBodies() {
      const bodies = allBodies();
      const n = bodies.length;
      for (let i = 0; i < n; i++) {
        const a = bodies[i];
        for (let j = i + 1; j < n; j++) {
          const b = bodies[j];
          const hit = deepestCircleContact(a, b);
          if (!hit) continue;
          let nx, ny;
          if (hit.d < 1e-6) { const t = Math.random() * TAU; nx = Math.cos(t); ny = Math.sin(t); }
          else { nx = hit.dx / hit.d; ny = hit.dy / hit.d; }
          const tot = a.m + b.m;
          a.x -= nx * hit.pen * (b.m / tot); a.y -= ny * hit.pen * (b.m / tot);
          b.x += nx * hit.pen * (a.m / tot); b.y += ny * hit.pen * (a.m / tot);
          const vrel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (vrel < 0) {
            const impulse = -(1 + REST) * vrel / (1 / a.m + 1 / b.m);
            a.vx -= impulse / a.m * nx; a.vy -= impulse / a.m * ny;
            b.vx += impulse / b.m * nx; b.vy += impulse / b.m * ny;
          }
        }
      }
    }

    // ---------- Interface ----------
    sizeRange.min = Math.log(MIN_SIZE);
    sizeRange.max = Math.log(MAX_SIZE);
    countRange.min = MIN_LETTERS;
    countRange.max = MAX_LETTERS;
    countRange.value = INITIAL_LETTERS;
    backgroundRange.value = 0;

    sizeRange.value = Math.log(globalSize);

    function setBackground(v, withSound = true) {
      v = Math.max(0, Math.min(361, Math.round(v)));
      backgroundRange.value = v;
      if (v === 0) {
        document.documentElement.style.backgroundColor = '#000';
        document.body.style.backgroundColor = '#000';
      } else {
        const hue = v - 1;
        const color = `hsl(${hue} 100% 50%)`;
        document.documentElement.style.backgroundColor = color;
        document.body.style.backgroundColor = color;
      }
      if (withSound) uiBeep(v / 361);
    }

    setBackground(0, false);

    function setGlobalSize(v) {
      v = Math.min(MAX_SIZE, Math.max(MIN_SIZE, v));
      globalSize = v;
      sizeRange.value = Math.log(v);
      for (const B of allBodies()) B.targetSz = v;
      uiBeep((v - MIN_SIZE) / (MAX_SIZE - MIN_SIZE));
    }

    // Counter changes only generated background letters. User-created words are protected.
    function ensureLetterCount(target) {
      target = Math.max(MIN_LETTERS, Math.min(MAX_LETTERS, Math.round(target)));
      while (letters.length < target) spawnLetter(false);
      if (letters.length > target) letters.splice(0, letters.length - target);
    }

    function sanitizeInput(value) {
      // Latin letters, numbers, spaces and the same family of punctuation glyphs used in the scene.
      return value.replace(/[^a-zA-Z0-9 .,;:!?()&@%+'\-–—]/g, '').slice(0, MAX_INPUT_CHARS);
    }

    charInput.addEventListener('input', () => {
      charInput.value = sanitizeInput(charInput.value);
      inputWrap.classList.toggle('has-text', charInput.value.length > 0);
    });

    charInput.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const text = sanitizeInput(charInput.value).trim();
      if (!text) return;
      createWord(text, globalSize);
      uiBeep(0.75);
      charInput.value = '';
      inputWrap.classList.remove('has-text');
      charInput.focus();
    });

    sizeRange.addEventListener('pointerdown', () => ensureAudio());
    sizeRange.addEventListener('input', () => setGlobalSize(Math.exp(parseFloat(sizeRange.value))));
    countRange.addEventListener('pointerdown', () => ensureAudio());
    countRange.addEventListener('input', () => {
      ensureLetterCount(parseInt(countRange.value, 10));
      uiBeep((parseInt(countRange.value, 10) - MIN_LETTERS) / (MAX_LETTERS - MIN_LETTERS));
    });
    backgroundRange.addEventListener('pointerdown', () => ensureAudio());
    backgroundRange.addEventListener('input', () => setBackground(parseInt(backgroundRange.value, 10)));


    function resetScene() {
      stopCamera();
      letters = [];
      words = [];
      globalSize = 1;
      sizeRange.value = Math.log(globalSize);
      countRange.value = INITIAL_LETTERS;
      setBackground(0, false);
      charInput.value = '';
      inputWrap.classList.remove('has-text');
      shakeIntro.classList.remove('show');
      seedLetters();
      charInput.focus();
      uiBeep(0.2);
    }

    cleanButton.addEventListener('click', resetScene);

    function drawTypedText(text, size, y) {
      const chars = Array.from(text);
      const scale = size / FONT_PX;
      const total = textWidth(text) * scale;
      const kern = size * WORD_KERN_EM;
      let cursor = -total * 0.5;
      for (let i = 0; i < chars.length; i++) {
        const ch = chars[i];
        const w = charWidth(ch) * scale;
        g.fillText(ch, cursor + w * 0.5, y);
        cursor += w;
        if (i < chars.length - 1) cursor += kern;
      }
    }

    // ---------- Main loop ----------
    function animate() {
      const W = window.innerWidth, H = window.innerHeight;
      const now = performance.now();
      try { detect(); } catch (err) { console.warn(err); }
      updatePushers();

      const bodies = allBodies();
      for (const B of bodies) {
        const s = Math.min(1, Math.max(0, (now - B.born) / BORN_MS));
        B.scale = 1 - Math.pow(1 - s, 3);

        B.sz += ((B.targetSz ?? globalSize) - B.sz) * 0.12;
        if (B.kind === 'word') B.rot += (B.targetRot - B.rot) * 0.15;

        B.rr = B.r0 * B.sz * B.scale;
        B.m = Math.max(1, B.r0 * B.r0 * B.sz * B.sz);

        const turn = (Math.random() - 0.5) * 0.06;
        const c = Math.cos(turn), sn = Math.sin(turn);
        const vx = B.vx * c - B.vy * sn;
        const vy = B.vx * sn + B.vy * c;
        const cur = Math.hypot(vx, vy) || 1e-4;
        let sp = cur + (B.base - cur) * 0.02;
        sp = Math.min(sp, MAX_SPEED);
        B.vx = vx / cur * sp; B.vy = vy / cur * sp;
        B.x += B.vx; B.y += B.vy;
      }

      collideBodies();
      collideBodies();
      collidePushers();

      for (const B of bodies) {
        const r = Math.min(B.rr, W / 2 - 1, H / 2 - 1);
        if (B.x < r) { B.x = r; B.vx = Math.abs(B.vx); }
        else if (B.x > W - r) { B.x = W - r; B.vx = -Math.abs(B.vx); }
        if (B.y < r) { B.y = r; B.vy = Math.abs(B.vy); }
        else if (B.y > H - r) { B.y = H - r; B.vy = -Math.abs(B.vy); }
      }

      g.setTransform(DPR, 0, 0, DPR, 0, 0);
      g.clearRect(0, 0, W, H);
      g.textAlign = 'center';
      g.textBaseline = 'alphabetic';

      for (const B of bodies) {
        const size = FONT_PX * B.scale * B.sz;
        if (size < 0.5) continue;
        g.font = `${size}px "Times New Roman", Times, serif`;
        g.fillStyle = B.kind === 'word' ? (B.color || '#39ff14') : '#fff';
        g.globalAlpha = B.alpha;
        g.save();
        g.translate(B.x, B.y);
        g.rotate(B.rot || 0);
        if (B.kind === 'word') drawTypedText(B.text, size, 0.3375 * size);
        else g.fillText(B.char, 0, 0.3375 * size);
        g.restore();
      }
      g.globalAlpha = 1;
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
